<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>整页一键翻译 · 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <span class="seal" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <path d="M15 24V15H24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"></path>
            <path d="M40 15H49V24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"></path>
            <path d="M49 40V49H40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"></path>
            <path d="M24 49H15V40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"></path>
            <path fill="currentColor" d="M23 17l1.5 3.8 3.9 1.1-3.9 1.2L23 27l-1.5-3.9-3.8-1.2 3.8-1.1z"></path>
            <text x="41" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="700" fill="currentColor">A</text>
          </svg>
        </span>
        <div>
          <p class="eyebrow">DeepSeek · 双语对照</p>
          <h1>整页一键翻译</h1>
          <p class="lede">原文留在上面，译文贴在段落下。Claude、Agent 这类词继续用英文。</p>
        </div>
      </header>

      <section class="card" aria-labelledby="api-title">
        <div class="section-head">
          <h2 id="api-title">接口</h2>
          <p>Key 只存在这台浏览器里，不会写进网页。</p>
        </div>
        <label class="field">
          <span>API Key</span>
          <span class="row">
            <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-..." />
            <button type="button" id="toggleKey" class="ghost">显示</button>
          </span>
        </label>
        <div class="grid">
          <label class="field">
            <span>模型</span>
            <input id="model" type="text" spellcheck="false" placeholder="deepseek-chat" />
          </label>
          <label class="field">
            <span>Base URL</span>
            <input id="baseUrl" type="url" spellcheck="false" placeholder="https://api.deepseek.com" />
          </label>
        </div>
        <label class="field">
          <span>目标语言</span>
          <select id="targetLanguage"></select>
        </label>
        <label class="check">
          <input id="demoMode" type="checkbox" />
          <span>演示模式：不调用 API，用本地对照表走同一套术语保护，方便没有 Key 时预览。</span>
        </label>
      </section>

      <section class="card" aria-labelledby="fab-title">
        <div class="section-head">
          <h2 id="fab-title">右侧悬浮按钮</h2>
          <p>半露在页面右缘。悬停展开，可上下拖动，位置会记住。</p>
        </div>
        <label class="check">
          <input id="fabEnabled" type="checkbox" />
          <span>显示悬浮按钮。关掉之后，仍可用工具栏图标或 Alt+Shift+T。</span>
        </label>
        <label class="field">
          <span>这些网站不显示按钮</span>
          <textarea id="disabledSites" rows="4" spellcheck="false" placeholder="docs.google.com&#10;mail.google.com"></textarea>
          <small>每行一个域名。写 <code>example.com</code> 会连同它的子域名一起隐藏；工具栏和快捷键仍然可用。</small>
        </label>
      </section>

      <section class="card" aria-labelledby="term-title">
        <div class="section-head">
          <h2 id="term-title">术语白名单</h2>
          <p>送翻前换成占位符，译完再换回英文。模型若把占位符弄丢，还会按常见误译改回来。</p>
        </div>
        <div class="row add-row">
          <input id="termInput" type="text" placeholder="例如：OpenRouter" maxlength="80" />
          <button type="button" id="addTerm">添加</button>
        </div>
        <label class="field filter">
          <span>筛选</span>
          <input id="termFilter" type="search" placeholder="Claude、Kubernetes…" />
        </label>
        <div id="termList" class="terms" aria-live="polite"></div>
        <div class="row end">
          <button type="button" id="resetTerms" class="ghost">恢复内置术语</button>
          <span id="termCount" class="muted"></span>
        </div>
      </section>

      <div class="actions">
        <button type="button" id="save" class="primary">保存设置</button>
        <button type="button" id="test" class="ghost">保存并测试连接</button>
        <p id="status" role="status"></p>
      </div>
    </main>
    <script src="lib/terms.js"></script>
    <script src="lib/sites.js"></script>
    <script src="lib/settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
